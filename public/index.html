<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Wardrobe</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f7f4;
  --surface:#fff;
  --border:#e5e3df;
  --border-strong:#ccc;
  --text:#1a1a18;
  --text-sec:#6b6b68;
  --text-muted:#9b9b98;
  --accent:#1a1a18;
  --accent-light:#f0efeb;
  --radius:10px;
  --font:'Inter',system-ui,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;min-height:100vh}

/* top bar */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;gap:16px;height:58px;position:sticky;top:0;z-index:10}
.logo{font-size:16px;font-weight:600;letter-spacing:-0.02em;flex:1}
.logo span{color:var(--text-sec);font-weight:400}
.search-wrap{position:relative;flex:1;max-width:280px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);width:16px;height:16px}
#search{width:100%;padding:7px 10px 7px 32px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:14px;color:var(--text);outline:none}
#search:focus{border-color:var(--border-strong)}
.btn{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);display:flex;align-items:center;gap:6px;white-space:nowrap;transition:background .1s}
.btn:hover{background:var(--accent-light)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{opacity:0.88}

/* layout */
.main{display:flex;min-height:calc(100vh - 58px)}
.sidebar{width:200px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);padding:1.25rem 0}
.content{flex:1;padding:1.5rem;max-width:calc(100% - 200px)}

/* filters */
.sidebar-label{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--text-muted);padding:0 1.25rem;margin-bottom:6px;text-transform:uppercase}
.filter-item{padding:7px 1.25rem;font-size:14px;color:var(--text-sec);cursor:pointer;border-radius:0;border:none;background:none;width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;transition:background .1s}
.filter-item:hover{background:var(--accent-light)}
.filter-item.active{background:var(--accent-light);color:var(--text);font-weight:500}
.filter-count{font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:1px 7px;color:var(--text-muted)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative}
.card:hover{border-color:var(--border-strong);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.card.selected{border:2px solid var(--accent);box-shadow:0 0 0 3px rgba(26,26,24,.08)}
.card-img{height:140px;display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:56px;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:10px 12px 12px}
.card-name{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{font-size:12px;color:var(--text-sec);margin-top:2px}
.card-loc{font-size:11px;color:var(--text-muted);margin-top:5px;display:flex;align-items:center;gap:3px}
.card-del{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .15s;font-size:13px}
.card:hover .card-del{opacity:1}
.card-del:hover{background:#fee2e2;border-color:#fca5a5;color:#dc2626}
.sel-badge{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}

/* cart bar */
.cartbar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:10px 1.5rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap;z-index:10}
.cart-pills{display:flex;gap:6px;flex:1;flex-wrap:wrap;min-height:30px;align-items:center}
.pill{font-size:12px;padding:4px 10px;background:var(--accent-light);border:1px solid var(--border);border-radius:20px;color:var(--text);display:flex;align-items:center;gap:5px}
.pill button{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:14px;line-height:1}
.cart-empty{font-size:13px;color:var(--text-muted)}

/* modal / drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.overlay.center{align-items:center}
.drawer{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:520px;padding:1.5rem;max-height:85vh;overflow-y:auto}
.drawer.modal{border-radius:16px;max-height:90vh}
.drawer-handle{width:40px;height:4px;background:var(--border-strong);border-radius:2px;margin:0 auto 1.25rem;cursor:pointer}
.drawer h2{font-size:18px;font-weight:600;margin-bottom:1.25rem;letter-spacing:-0.02em}
.loc-row{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);gap:12px}
.loc-row:last-child{border-bottom:none}
.loc-item{font-size:14px;font-weight:500;color:var(--text)}
.loc-item small{display:block;font-size:12px;color:var(--text-sec);font-weight:400;margin-top:1px}
.loc-tag{font-size:12px;background:var(--accent-light);border:1px solid var(--border);border-radius:20px;padding:4px 10px;color:var(--text);white-space:nowrap;flex-shrink:0}

/* add form */
.form-row{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.form-row label{font-size:13px;font-weight:500;color:var(--text-sec)}
.form-row input,.form-row select,.form-row textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;color:var(--text);background:var(--surface);outline:none;font-family:var(--font)}
.form-row input:focus,.form-row select:focus{border-color:var(--border-strong)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.upload-area{border:1.5px dashed var(--border-strong);border-radius:10px;padding:1.5rem;text-align:center;cursor:pointer;background:var(--bg);transition:border-color .15s}
.upload-area:hover{border-color:var(--accent)}
.upload-area input{display:none}
.preview-img{width:100%;max-height:160px;object-fit:cover;border-radius:8px;margin-top:8px}
.err{font-size:12px;color:#dc2626;margin-top:4px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text-sec)}
.empty-state .emo{font-size:48px;display:block;margin-bottom:12px}

/* responsive */
@media(max-width:600px){
  .sidebar{display:none}
  .content{max-width:100%;padding:1rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">My Wardrobe <span>—</span></div>
  <div class="search-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="search" type="text" placeholder="Search..." oninput="loadItems()">
  </div>
  <button class="btn primary" onclick="openAdd()">+ Add item</button>
</header>

<div class="main">
  <aside class="sidebar">
    <div class="sidebar-label">Category</div>
    <div id="filters"></div>
  </aside>
  <div class="content">
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="cartbar" id="cartbar">
  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
  <div class="cart-pills" id="cart-pills"><span class="cart-empty">Tap items to select, then find them in your room</span></div>
  <button class="btn primary" id="checkout-btn" onclick="checkout()" style="display:none">Find in room →</button>
</div>

<!-- overlays -->
<div class="overlay" id="add-overlay" style="display:none" onclick="closeAdd(event)">
  <div class="drawer modal" onclick="e=>e.stopPropagation()">
    <div class="drawer-handle" onclick="closeAdd()"></div>
    <h2>Add new item</h2>
    <div class="form-grid">
      <div class="form-row">
        <label>Emoji</label>
        <input id="f-emoji" type="text" placeholder="👕" maxlength="2">
      </div>
      <div class="form-row">
        <label>Category</label>
        <select id="f-cat">
          <option>Tops</option><option>Bottoms</option><option>Footwear</option>
          <option>Outerwear</option><option>Accessories</option><option>Formal</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <label>Item name *</label>
      <input id="f-name" type="text" placeholder="e.g. White Oxford shirt">
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>Colour</label>
        <input id="f-color" type="text" placeholder="e.g. Navy blue">
      </div>
      <div class="form-row">
        <label>Location *</label>
        <input id="f-loc" type="text" placeholder="e.g. Bedroom wardrobe — shelf 2">
      </div>
    </div>
    <div class="form-row">
      <label>Photo</label>
      <div class="upload-area" id="upload-area" onclick="document.getElementById('f-image').click()">
        <input type="file" id="f-image" accept="image/*" onchange="previewImage(event)">
        <div id="upload-label">📷 Tap to upload a photo</div>
        <img id="f-preview" class="preview-img" style="display:none">
      </div>
    </div>
    <div class="err" id="f-err"></div>
    <div class="form-actions">
      <button class="btn" onclick="closeAdd()">Cancel</button>
      <button class="btn primary" onclick="submitAdd()">Add to wardrobe</button>
    </div>
  </div>
</div>

<div class="overlay center" id="checkout-overlay" style="display:none" onclick="closeCheckout(event)">
  <div class="drawer modal" onclick="e=>e.stopPropagation()" style="max-width:440px">
    <div class="drawer-handle" onclick="closeCheckout()"></div>
    <h2>📍 Where to find your items</h2>
    <div id="checkout-list"></div>
    <div class="form-actions" style="margin-top:1rem">
      <button class="btn primary" onclick="closeCheckout()">Done</button>
    </div>
  </div>
</div>

<script>
let cart=[], activeFilter='All', items=[];

async function loadItems(){
  const q=document.getElementById('search').value;
  const params=new URLSearchParams();
  if(q) params.set('search',q);
  if(activeFilter!=='All') params.set('category',activeFilter);
  const res=await fetch('/api/items?'+params);
  items=await res.json();
  renderGrid();
  await loadFilters();
}

async function loadFilters(){
  const res=await fetch('/api/categories');
  const cats=await res.json();
  const all=['All',...cats];
  document.getElementById('filters').innerHTML=all.map(c=>{
    const cnt=c==='All'?items.length:items.filter(i=>i.category===c).length;
    return`<button class="filter-item${c===activeFilter?' active':''}" onclick="setFilter('${c}')">
      ${c} <span class="filter-count">${cnt}</span>
    </button>`;
  }).join('');
}

function setFilter(f){activeFilter=f;loadItems()}

function renderGrid(){
  const g=document.getElementById('grid');
  if(!items.length){
    g.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><span class="emo">🪞</span>No items here yet.<br><small>Add your first item using the button above.</small></div>`;
    return;
  }
  g.innerHTML=items.map(item=>{
    const sel=cart.includes(item.id);
    const img=item.image_path
      ?`<img src="${item.image_path}" alt="${item.name}" loading="lazy">`
      :`${item.emoji||'👕'}`;
    return`<div class="card${sel?' selected':''}" onclick="toggleCart('${item.id}')" tabindex="0" role="button" aria-pressed="${sel}" aria-label="${item.name}">
      ${sel?`<div class="sel-badge">✓</div>`:''}
      <button class="card-del" onclick="deleteItem(event,'${item.id}')" aria-label="Delete ${item.name}">✕</button>
      <div class="card-img">${img}</div>
      <div class="card-body">
        <div class="card-name">${item.name}</div>
        <div class="card-sub">${item.category}${item.color?' · '+item.color:''}</div>
        <div class="card-loc">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          ${item.location}
        </div>
      </div>
    </div>`;
  }).join('');
  renderCart();
}

function toggleCart(id){
  const i=cart.indexOf(id);
  if(i===-1) cart.push(id); else cart.splice(i,1);
  renderGrid();
}

function renderCart(){
  const pills=document.getElementById('cart-pills');
  const btn=document.getElementById('checkout-btn');
  if(!cart.length){
    pills.innerHTML=`<span class="cart-empty">Tap items to select, then find them in your room</span>`;
    btn.style.display='none';
    return;
  }
  btn.style.display='';
  pills.innerHTML=cart.map(id=>{
    const item=items.find(x=>x.id===id);
    return item?`<span class="pill">${item.emoji||'👕'} ${item.name}<button onclick="removeCart(event,'${id}')" aria-label="Remove">×</button></span>`:'';
  }).join('');
}

function removeCart(e,id){e.stopPropagation();cart=cart.filter(x=>x!==id);renderGrid()}

function checkout(){
  const sel=cart.map(id=>items.find(x=>x.id===id)).filter(Boolean);
  const byLoc={};
  sel.forEach(item=>{if(!byLoc[item.location])byLoc[item.location]=[];byLoc[item.location].push(item)});
  document.getElementById('checkout-list').innerHTML=Object.entries(byLoc).map(([loc,its])=>
    its.map(item=>`
      <div class="loc-row">
        <div class="loc-item">
          ${item.emoji||'👕'} ${item.name}
          <small>${item.category}${item.color?' · '+item.color:''}</small>
        </div>
        <span class="loc-tag">📍 ${loc}</span>
      </div>
    `).join('')
  ).join('');
  document.getElementById('checkout-overlay').style.display='flex';
}

function closeCheckout(e){
  if(!e||e.target===document.getElementById('checkout-overlay'))
    document.getElementById('checkout-overlay').style.display='none';
}

async function deleteItem(e,id){
  e.stopPropagation();
  if(!confirm('Remove this item from your wardrobe?')) return;
  await fetch(`/api/items/${id}`,{method:'DELETE'});
  cart=cart.filter(x=>x!==id);
  loadItems();
}

function openAdd(){document.getElementById('add-overlay').style.display='flex'}
function closeAdd(e){
  if(!e||e.target===document.getElementById('add-overlay')){
    document.getElementById('add-overlay').style.display='none';
    document.getElementById('f-err').textContent='';
    document.getElementById('f-name').value='';
    document.getElementById('f-loc').value='';
    document.getElementById('f-emoji').value='';
    document.getElementById('f-color').value='';
    document.getElementById('f-preview').style.display='none';
    document.getElementById('upload-label').style.display='block';
  }
}

function previewImage(e){
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=document.getElementById('f-preview');
    img.src=ev.target.result;
    img.style.display='block';
    document.getElementById('upload-label').style.display='none';
  };
  reader.readAsDataURL(file);
}

async function submitAdd(){
  const name=document.getElementById('f-name').value.trim();
  const loc=document.getElementById('f-loc').value.trim();
  const err=document.getElementById('f-err');
  if(!name){err.textContent='Item name is required.';return}
  if(!loc){err.textContent='Location is required.';return}
  err.textContent='';
  const fd=new FormData();
  fd.append('emoji',document.getElementById('f-emoji').value||'👕');
  fd.append('name',name);
  fd.append('category',document.getElementById('f-cat').value);
  fd.append('color',document.getElementById('f-color').value);
  fd.append('location',loc);
  const file=document.getElementById('f-image').files[0];
  if(file) fd.append('image',file);
  const res=await fetch('/api/items',{method:'POST',body:fd});
  if(!res.ok){const d=await res.json();err.textContent=d.error||'Something went wrong.';return}
  closeAdd();
  loadItems();
}

loadItems();
</script>
</body>
</html>
